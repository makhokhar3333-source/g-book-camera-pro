name: Build Signed G-Book Camera APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Create Capacitor Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Generate Android App Icons from assets/icon.png
        run: npx capacitor-assets generate --android || true

      - name: Configure AndroidManifest.xml (AdMob App ID & Permissions)
        run: |
          python3 - << 'EOF'
          import xml.etree.ElementTree as ET
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"

          needed_perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.RECEIVE_BOOT_COMPLETED"
          ]
          existing_perms = {
              el.get(ns + "name") for el in root.findall("uses-permission")
          }
          for perm in needed_perms:
              if perm not in existing_perms:
                  el = ET.SubElement(root, "uses-permission")
                  el.set(ns + "name", perm)

          app_el = root.find("application")
          if app_el is not None:
              app_el.set(ns + "largeHeap", "true")
              app_el.set(ns + "hardwareAccelerated", "true")
              existing_meta = {
                  el.get(ns + "name"): el for el in app_el.findall("meta-data")
              }
              admob_key = "com.google.android.gms.ads.APPLICATION_ID"
              if admob_key in existing_meta:
                  existing_meta[admob_key].set(ns + "value", "ca-app-pub-1069125783691383~1918252053")
              else:
                  meta = ET.SubElement(app_el, "meta-data")
                  meta.set(ns + "name", admob_key)
                  meta.set(ns + "value", "ca-app-pub-1069125783691383~1918252053")

          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
          EOF

      - name: Sync Capacitor web bundle into Android
        run: npx cap sync android

      - name: Build & Sign app-release.apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null
            BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/34.0.0"
          fi
          RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$RAW_APK" ]; then
            RAW_APK="app/build/outputs/apk/release/app-release.apk"
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            STOREPASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEYPASS="$KEY_PASSWORD"
          else
            STOREPASS="gbookcamera2026"
            ALIAS="gbookcamera"
            KEYPASS="gbookcamera2026"
            keytool -genkeypair -v -keystore release.keystore \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STOREPASS" -keypass "$KEYPASS" \
              -dname "CN=G-Book Camera, OU=Mobile, O=GBookCamera, L=Karachi, S=Sindh, C=PK"
          fi

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$RAW_APK" app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STOREPASS" \
            --key-pass "pass:$KEYPASS" \
            --out app-release.apk \
            app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" verify app-release.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: G-Book-Camera-Release-APK
          path: android/app-release.apk
          if-no-files-found: error
